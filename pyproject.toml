[project]
name = "mulca-master-project"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "alfoCaiazza", email = "acaiazza2000@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "bertopic>=0.17.4",
    "datasets>=5.0.1",
    "en-core-web-sm",
    "fastapi[standard]>=0.141.1",
    "hdbscan>=0.8.44",
    "joblib>=1.6.0",
    "langid>=1.1.6",
    "matplotlib>=3.11.2",
    "nltk>=3.10.3",
    "numpy>=2.5.3",
    "pandas>=3.0.5",
    "redis>=8.1.0",
    "scikit-learn>=1.9.1",
    "seaborn>=0.13.2",
    "sentence-transformers>=6.0.1",
    "sentencepiece>=0.2.2",
    "shap>=0.49.1",
    "spacy>=3.8.16",
    "tiktoken>=0.14.0",
    "torch>=2.14.0",
    "transformers>=5.17.0",
    "umap-learn>=0.5.12",
    "xgboost>=3.4.1",
]

[project.scripts]
mulca-master-project = "mulca_master_project:main"

[build-system]
requires = ["uv_build>=0.12.11,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "jupyter>=1.1.1",
    "pytest>=9.1.1",
    "ruff>=0.16.6",
]

[tool.uv.sources]
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }
